[project]
name = "skills-evaluator"
version = "0.2.0"
description = "Tapes cassette that evaluates OpenClaw skill proposals against captured session data with DSPy"
readme = "README.md"
authors = [
    { name = "John McBride", email = "john@papercompute.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dspy>=3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
skills-evaluator = "skills_evaluator:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package lives at the repo root (skills_evaluator/), not under src/:
# one source tree, one level of nesting. uv_build requires the directory
# name to match the import name, so this is the flattest legal layout.
module-root = ""
