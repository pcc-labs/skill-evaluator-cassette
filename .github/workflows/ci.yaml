name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tapes
          POSTGRES_USER: tapes
          POSTGRES_PASSWORD: tapes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapes -d tapes"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Install locked environment
        run: nix develop --command uv sync --locked --all-groups

      - name: Test
        run: nix develop --command uv run pytest
        env:
          TEST_POSTGRES_DSN: postgresql://tapes:tapes@127.0.0.1:5432/tapes

  image:
    name: Image
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag skills-evaluator-cassette:ci .
